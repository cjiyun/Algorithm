name: Sync Algorithm Commit to Notion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update platform READMEs
        id: readmes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          platforms=()
          for platform in 프로그래머스 백준 SWEA; do
            if ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- "$platform/"; then
              platforms+=("$platform")
            fi
          done
          if (( ${#platforms[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/update-platform-readmes.js "${platforms[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated READMEs
        if: steps.readmes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 프로그래머스/README.md 백준/README.md SWEA/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: 문제 풀이 README 자동 갱신"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install dependencies
        run: npm install @notionhq/client

      - name: Sync latest commit to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PROGRAMMERS_DATA_SOURCE_ID: ${{ secrets.NOTION_PROGRAMMERS_DATA_SOURCE_ID }}
          NOTION_SWEA_DATA_SOURCE_ID: ${{ secrets.NOTION_SWEA_DATA_SOURCE_ID }}
          NOTION_BAEKJOON_DATA_SOURCE_ID: ${{ secrets.NOTION_BAEKJOON_DATA_SOURCE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/sync-notion-algorithm.js
